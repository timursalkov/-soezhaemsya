<!doctype html>
<html lang="ru">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#f5f7fb">
<title>СЪЕЗЖАЕМСЯ — прототип</title>
<style>

:root{
  --bg:#f4f7fb;
  --surface:rgba(255,255,255,.90);
  --surface-strong:#fff;
  --text:#1f2937;
  --muted:#7b8494;
  --line:#e4e9f1;
  --accent:#5f83e8;
  --accent-soft:#edf3ff;
  --accent-strong:#416bd9;
  --danger:#c95656;
  --shadow:0 20px 60px rgba(51,70,105,.10);
  --radius:22px;
}
*{box-sizing:border-box}
html{background:var(--bg);min-height:100%;-webkit-text-size-adjust:100%}
body{margin:0;min-height:100%;font-family:-apple-system,BlinkMacSystemFont,"SF Pro Display","SF Pro Text","Segoe UI",sans-serif;color:var(--text);background:
radial-gradient(circle at 12% 6%,rgba(143,174,245,.18),transparent 32%),
radial-gradient(circle at 92% 18%,rgba(192,174,245,.16),transparent 30%),
var(--bg);}
button,input,textarea,select{font:inherit}
button{touch-action:manipulation}
.app-shell{min-height:100svh;padding:max(18px,env(safe-area-inset-top)) 16px max(22px,env(safe-area-inset-bottom))}
.app{width:min(100%,460px);margin:0 auto;min-height:calc(100svh - 40px);display:flex;flex-direction:column}
.screen{display:flex;flex-direction:column;min-height:calc(100svh - 40px)}
.center-screen{justify-content:center}
.topbar{display:flex;align-items:center;justify-content:space-between;height:44px;margin-bottom:10px}
.icon-btn{width:44px;height:44px;border:0;background:transparent;border-radius:14px;color:var(--text);font-size:25px;display:grid;place-items:center;padding:0}
.progress-label{font-size:13px;font-weight:650;color:var(--muted);letter-spacing:.01em}
.progress{height:5px;background:#e7ecf4;border-radius:999px;overflow:hidden;margin:0 2px 28px}
.progress > span{display:block;height:100%;width:0;background:var(--accent);border-radius:inherit;transition:width .25s ease}
.brand-mark{width:74px;height:74px;border-radius:24px;background:linear-gradient(145deg,#dfe9ff,#eef1ff);display:grid;place-items:center;margin-bottom:22px;box-shadow:0 16px 40px rgba(75,105,180,.12)}
.brand-mark::before{content:"";width:35px;height:35px;border-radius:12px;background:var(--accent);transform:rotate(-10deg);opacity:.9}
.kicker{font-size:13px;font-weight:700;letter-spacing:.08em;text-transform:uppercase;color:var(--accent-strong);margin-bottom:9px}
h1{font-size:36px;line-height:1.03;letter-spacing:-.045em;margin:0 0 10px;font-weight:750}
.subtitle{font-size:18px;line-height:1.35;color:#697386;margin:0 0 28px}
.meta{display:flex;gap:8px;flex-wrap:wrap;margin:0 0 30px}
.pill{padding:8px 12px;border-radius:999px;background:rgba(255,255,255,.72);border:1px solid rgba(226,232,240,.9);font-size:13px;color:#657085}
.primary{width:100%;min-height:56px;border:0;border-radius:17px;background:var(--accent);color:#fff;font-weight:700;font-size:17px;box-shadow:0 12px 28px rgba(95,131,232,.25);transition:transform .12s ease,background .15s ease}
.primary:active{transform:scale(.985)}
.primary:disabled{opacity:.42;box-shadow:none}
.secondary{width:100%;min-height:52px;border:1px solid var(--line);border-radius:16px;background:rgba(255,255,255,.72);color:var(--text);font-weight:650;font-size:16px}
.start-card{background:rgba(255,255,255,.62);border:1px solid rgba(255,255,255,.75);border-radius:30px;padding:28px 24px;box-shadow:var(--shadow);backdrop-filter:blur(18px);-webkit-backdrop-filter:blur(18px)}
.resume-card{margin-top:14px;padding:15px;border-radius:18px;background:rgba(255,255,255,.70);border:1px solid var(--line);font-size:13px;color:var(--muted)}
.question-head{margin-bottom:22px}
.block-label{font-size:12px;font-weight:750;letter-spacing:.07em;text-transform:uppercase;color:var(--accent-strong);margin-bottom:8px}
.block-title{font-size:14px;color:var(--muted);margin-bottom:16px}
.question{font-size:22px;line-height:1.22;letter-spacing:-.025em;font-weight:720;margin:0}
.helper{font-size:13px;color:var(--muted);margin:8px 0 0}
.option-list{display:flex;flex-direction:column;gap:10px;margin:0 0 22px}
.option{position:relative;width:100%;min-height:52px;text-align:left;padding:14px 16px 14px 48px;border:1px solid var(--line);border-radius:17px;background:rgba(255,255,255,.82);color:var(--text);font-size:16px;line-height:1.28;display:flex;align-items:center;box-shadow:0 4px 16px rgba(60,75,105,.03);transition:border-color .15s,background .15s,box-shadow .15s,transform .12s}
.option:active{transform:scale(.992)}
.option::before{content:"";position:absolute;left:16px;top:50%;transform:translateY(-50%);width:20px;height:20px;border:1.7px solid #aeb7c6;border-radius:50%;background:#fff}
.option.selected{border-color:var(--accent);background:var(--accent-soft);box-shadow:0 7px 18px rgba(95,131,232,.09)}
.option.selected::before{border-color:var(--accent);background:var(--accent);box-shadow:inset 0 0 0 5px var(--accent-soft)}
.option.multi::before{border-radius:6px}
.option.multi.selected::before{border-color:var(--accent);background:var(--accent);box-shadow:none}
.option.multi.selected::after{content:"✓";position:absolute;left:20px;top:50%;transform:translateY(-52%);color:#fff;font-size:13px;font-weight:800}
.counter{font-size:13px;color:var(--muted);margin:-12px 0 18px}
.bottom{margin-top:auto;padding-top:12px;padding-bottom:4px}
.textarea{width:100%;min-height:116px;resize:none;border:1px solid var(--line);border-radius:18px;background:rgba(255,255,255,.86);padding:16px;font-size:16px;line-height:1.45;color:var(--text);outline:none;box-shadow:0 4px 16px rgba(60,75,105,.03)}
.textarea:focus{border-color:var(--accent);box-shadow:0 0 0 4px rgba(95,131,232,.10)}
.scale-wrap{background:rgba(255,255,255,.72);border:1px solid var(--line);border-radius:22px;padding:22px 18px;margin-bottom:22px}
.scale-value{text-align:center;font-size:44px;line-height:1;font-weight:760;letter-spacing:-.04em;margin-bottom:18px}
.range{width:100%;height:32px;accent-color:var(--accent)}
.scale-labels{display:flex;justify-content:space-between;gap:15px;font-size:12px;color:var(--muted);line-height:1.25}
.scale-labels span:last-child{text-align:right}
.scenario{background:rgba(255,255,255,.78);border:1px solid var(--line);border-radius:25px;padding:20px 16px;box-shadow:var(--shadow)}
.scenario-tag{font-size:12px;font-weight:800;letter-spacing:.07em;color:var(--accent-strong);text-transform:uppercase;margin-bottom:10px}
.scenario-title{font-size:22px;line-height:1.2;font-weight:720;letter-spacing:-.025em;margin:0 0 18px}
.subquestion{font-size:15px;font-weight:700;margin:22px 0 10px}
.rank-list{display:flex;flex-direction:column;gap:10px;margin-bottom:22px}
.rank-row{display:grid;grid-template-columns:30px 1fr;align-items:center;gap:8px}
.rank-num{font-size:14px;font-weight:750;color:var(--muted);text-align:center}
.select{width:100%;min-height:52px;border:1px solid var(--line);border-radius:16px;background:#fff;padding:0 12px;font-size:16px;color:var(--text)}
.saved{font-size:12px;color:#6f7b8d;text-align:center;min-height:17px;margin-bottom:6px}
.completion-icon{width:68px;height:68px;border-radius:22px;background:var(--accent-soft);display:grid;place-items:center;color:var(--accent);font-size:31px;font-weight:800;margin-bottom:22px}
.completion h2{font-size:30px;line-height:1.05;letter-spacing:-.035em;margin:0 0 10px}
.completion p{font-size:16px;line-height:1.45;color:var(--muted);margin:0 0 28px}
.actions{display:flex;flex-direction:column;gap:10px}
.toast{position:fixed;left:50%;bottom:max(18px,env(safe-area-inset-bottom));transform:translate(-50%,20px);background:#202938;color:#fff;padding:10px 14px;border-radius:999px;font-size:13px;opacity:0;pointer-events:none;transition:opacity .2s,transform .2s;z-index:10}
.toast.show{opacity:1;transform:translate(-50%,0)}
@media(min-width:700px){
  .app-shell{padding-top:32px}
  .app{min-height:calc(100vh - 64px)}
  .screen{min-height:calc(100vh - 64px)}
}

</style>
</head>
<body>
<div class="app-shell">
  <main id="app" class="app"></main>
</div>
<script>

window.SOEZHAEMSYA_PROTOTYPE = [
  {
    id: 1, block: 1, blockTitle: "Представление о совместной жизни", type: "single",
    text: "Идеальный обычный вечер дома:",
    options: [
      "В основном проводим его вместе",
      "Вместе, но каждый занимается своим",
      "Иногда вместе, иногда отдельно",
      "В основном каждый занимается своими делами",
      "Зависит от дня и обстоятельств",
      "Другое"
    ]
  },
  {
    id: 3, block: 1, blockTitle: "Представление о совместной жизни", type: "multi", max: 3,
    text: "Что больше всего важно для комфортной совместной жизни? Выбери до 3 вариантов:",
    options: ["Спокойствие","Чистота и порядок","Много времени вместе","Личное пространство","Предсказуемость и договорённости","Свобода делать по-своему","Забота и поддержка","Спонтанность","Другое"]
  },
  {
    id: 2, block: 1, blockTitle: "Представление о совместной жизни", type: "scale",
    text: "Насколько важно, чтобы дом ощущался как общее пространство пары?",
    minLabel: "Совсем не важно", maxLabel: "Очень важно"
  },
  {
    id: 5, block: 1, blockTitle: "Представление о совместной жизни", type: "text",
    text: "Назови до 3 вещей, без которых дом перестаёт ощущаться для тебя комфортным.",
    lines: 4
  },
  {
    id: 74, block: 13, blockTitle: "Реальные бытовые ситуации", type: "scenario",
    text: "После тяжёлого дня на кухне осталась посуда.",
    prompt: "Как ты скорее всего поступишь?",
    options: [
      "Помыть самому/самой, не придавая этому значения",
      "Попросить партнёра помыть",
      "Договориться, кто сделает сейчас",
      "Оставить до завтра",
      "Разделить: часть сейчас, часть позже",
      "Раздражаться, но ничего не делать",
      "Зависит от ситуации"
    ],
    scaleLabel: "Насколько тебя это раздражает?",
    scaleMin: "Совсем не раздражает",
    scaleMax: "Очень раздражает",
    openLabel: "Что в такой ситуации партнёру лучше сделать?",
    lines: 3
  }
];

</script>
<script>

(() => {
  const qs = window.SOEZHAEMSYA_PROTOTYPE;
  const KEY = "soezhaemsya.prototype.v1";
  const state = loadState() || {
    name: "",
    current: 0,
    answers: {},
    started: false,
    completed: false,
    rankingDemo: {},
    demoIndex: 0
  };

  // The prototype intentionally contains only representative screens.
  // The production question data will be plugged in later without changing the UI engine.
  const demoScreens = [
    {kind:"question", qid:1},
    {kind:"question", qid:3},
    {kind:"question", qid:2},
    {kind:"question", qid:5},
    {kind:"ranking"},
    {kind:"question", qid:74}
  ];

  function loadState(){
    try { return JSON.parse(localStorage.getItem(KEY)); } catch(e) { return null; }
  }
  function save(){
    localStorage.setItem(KEY, JSON.stringify(state));
    setSaved();
  }
  function setSaved(){
    const el=document.querySelector("[data-saved]");
    if(el){ el.textContent="✓ Сохранено"; setTimeout(()=>{ if(el) el.textContent=""; },900); }
  }
  function esc(s){
    return String(s).replace(/[&<>"']/g,m=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[m]));
  }
  function findQ(id){ return qs.find(q=>q.id===id); }
  function render(){
    const app=document.getElementById("app");
    if(!state.started){ renderStart(app); return; }
    if(state.completed){ renderCompletion(app); return; }
    renderDemo(app);
  }
  function renderStart(app){
    const hasResume = Object.keys(state.answers).length || state.rankingDemo && Object.keys(state.rankingDemo).length;
    app.innerHTML=`
      <section class="screen center-screen">
        <div class="start-card">
          <div class="brand-mark" aria-hidden="true"></div>
          <div class="kicker">Тест перед совместной жизнью</div>
          <h1>СЪЕЗЖАЕМСЯ</h1>
          <p class="subtitle">Рабочий мобильный прототип. Здесь проверяем удобство прохождения до переноса всех 89 заданий.</p>
          <div class="meta"><span class="pill">89 вопросов в полной версии</span><span class="pill">iPhone / Safari</span></div>
          <label class="helper" for="name">Имя</label>
          <input id="name" class="select" style="margin:7px 0 14px" value="${esc(state.name||"")}" placeholder="Введите имя" autocomplete="name">
          <button class="primary" id="startBtn">${hasResume ? "Продолжить прототип" : "Начать тест"}</button>
          ${hasResume ? `<div class="resume-card">Сохранённый прогресс найден. Ответы хранятся локально на этом устройстве.</div>` : ""}
        </div>
      </section>`;
    document.getElementById("name").addEventListener("input",e=>{state.name=e.target.value;save();});
    document.getElementById("startBtn").addEventListener("click",()=>{
      state.started=true; save(); render();
    });
  }
  function renderChrome(title, num, percent){
    return `<div class="topbar">
      <button class="icon-btn" id="backBtn" aria-label="Назад">‹</button>
      <div class="progress-label">${num ? num+" / 89" : "Прототип"}</div>
    </div>
    <div class="progress"><span style="width:${percent}%"></span></div>
    <div class="question-head">
      <div class="block-label">${title}</div>
    </div>`;
  }
  function renderDemo(app){
    const screen=demoScreens[state.demoIndex];
    const total=demoScreens.length;
    if(screen.kind==="ranking"){ renderRanking(app,total); return; }
    const q=findQ(screen.qid);
    if(!q) return;
    if(q.type==="single") renderSingle(app,q,total);
    if(q.type==="multi") renderMulti(app,q,total);
    if(q.type==="scale") renderScale(app,q,total);
    if(q.type==="text") renderText(app,q,total);
    if(q.type==="scenario") renderScenario(app,q,total);
  }
  function footer(disabled=false){
    return `<div class="bottom">
      <div class="saved" data-saved></div>
      <button class="primary" id="nextBtn" ${disabled?"disabled":""}>Далее →</button>
    </div>`;
  }
  function selected(qid){ return state.answers[qid]; }
  function optionsHtml(q, multi){
    const val=selected(q.id);
    return q.options.map((o,i)=>{
      const active=multi ? Array.isArray(val)&&val.includes(i) : val===i;
      return `<button type="button" class="option ${multi?"multi":""} ${active?"selected":""}" data-opt="${i}">${esc(o)}</button>`;
    }).join("");
  }
  function renderSingle(app,q,total){
    const val=selected(q.id);
    app.innerHTML=`<section class="screen">
      ${renderChrome(`БЛОК ${q.block} / 13`, q.id, (q.id/89)*100)}
      <div class="block-title">${esc(q.blockTitle)}</div>
      <h2 class="question">${esc(q.text)}</h2>
      <div class="option-list" style="margin-top:18px">${optionsHtml(q,false)}</div>
      ${footer(val===undefined)}
    </section>`;
    bindOptions(q,false);
    document.getElementById("nextBtn").onclick=next;
    document.getElementById("backBtn").onclick=back;
  }
  function renderMulti(app,q,total){
    const val=selected(q.id)||[];
    app.innerHTML=`<section class="screen">
      ${renderChrome(`БЛОК ${q.block} / 13`, q.id, (q.id/89)*100)}
      <div class="block-title">${esc(q.blockTitle)}</div>
      <h2 class="question">${esc(q.text)}</h2>
      <div class="option-list" style="margin-top:18px">${optionsHtml(q,true)}</div>
      <div class="counter">${val.length} / ${q.max} выбрано</div>
      ${footer(val.length===0)}
    </section>`;
    bindOptions(q,true);
    document.getElementById("nextBtn").onclick=next;
    document.getElementById("backBtn").onclick=back;
  }
  function renderScale(app,q,total){
    const val=selected(q.id);
    const value=val===undefined?5:val;
    app.innerHTML=`<section class="screen">
      ${renderChrome(`БЛОК ${q.block} / 13`, q.id, (q.id/89)*100)}
      <div class="block-title">${esc(q.blockTitle)}</div>
      <h2 class="question">${esc(q.text)}</h2>
      <div class="scale-wrap" style="margin-top:20px">
        <div class="scale-value" id="scaleValue">${value}</div>
        <input class="range" id="range" type="range" min="0" max="10" step="1" value="${value}" aria-label="Шкала от 0 до 10">
        <div class="scale-labels"><span>0<br>${esc(q.minLabel)}</span><span>10<br>${esc(q.maxLabel)}</span></div>
      </div>
      ${footer(false)}
    </section>`;
    document.getElementById("range").addEventListener("input",e=>{
      state.answers[q.id]=Number(e.target.value);
      document.getElementById("scaleValue").textContent=e.target.value;
      save();
    });
    document.getElementById("nextBtn").onclick=next;
    document.getElementById("backBtn").onclick=back;
  }
  function renderText(app,q,total){
    const val=selected(q.id)||"";
    app.innerHTML=`<section class="screen">
      ${renderChrome(`БЛОК ${q.block} / 13`, q.id, (q.id/89)*100)}
      <div class="block-title">${esc(q.blockTitle)}</div>
      <h2 class="question">${esc(q.text)}</h2>
      <textarea id="textAnswer" class="textarea" rows="${q.lines}" style="margin-top:20px" placeholder="Напиши свой ответ…">${esc(val)}</textarea>
      ${footer(false)}
    </section>`;
    const ta=document.getElementById("textAnswer");
    const autosize=()=>{ta.style.height="auto";ta.style.height=Math.max(116,ta.scrollHeight)+"px";};
    ta.addEventListener("input",()=>{state.answers[q.id]=ta.value;autosize();save();});
    autosize();
    document.getElementById("nextBtn").onclick=next;
    document.getElementById("backBtn").onclick=back;
  }
  function renderScenario(app,q,total){
    const val=selected(q.id)||{};
    const choice=val.choice;
    const scale=val.scale===undefined?5:val.scale;
    const text=val.text||"";
    app.innerHTML=`<section class="screen">
      ${renderChrome(`БЛОК ${q.block} / 13`, q.id, (q.id/89)*100)}
      <div class="scenario">
        <div class="scenario-tag">Ситуация ${q.id}</div>
        <h2 class="scenario-title">${esc(q.text)}</h2>
        <div class="subquestion">${esc(q.prompt)}</div>
        <div class="option-list">${q.options.map((o,i)=>`<button type="button" class="option ${choice===i?"selected":""}" data-opt="${i}">${esc(o)}</button>`).join("")}</div>
        <div class="subquestion">${esc(q.scaleLabel)}</div>
        <div class="scale-wrap">
          <div class="scale-value" id="scenarioScale">${scale}</div>
          <input class="range" id="scenarioRange" type="range" min="0" max="10" step="1" value="${scale}">
          <div class="scale-labels"><span>0<br>${esc(q.scaleMin)}</span><span>10<br>${esc(q.scaleMax)}</span></div>
        </div>
        <div class="subquestion">${esc(q.openLabel)}</div>
        <textarea id="scenarioText" class="textarea" rows="${q.lines}" placeholder="Напиши свой ответ…">${esc(text)}</textarea>
      </div>
      ${footer(choice===undefined)}
    </section>`;
    document.querySelectorAll("[data-opt]").forEach(b=>b.addEventListener("click",()=>{
      const i=Number(b.dataset.opt); const cur=state.answers[q.id]||{};
      state.answers[q.id]={...cur,choice:i}; save(); render();
    }));
    document.getElementById("scenarioRange").addEventListener("input",e=>{
      const cur=state.answers[q.id]||{}; state.answers[q.id]={...cur,scale:Number(e.target.value)};
      document.getElementById("scenarioScale").textContent=e.target.value; save();
    });
    document.getElementById("scenarioText").addEventListener("input",e=>{
      const cur=state.answers[q.id]||{}; state.answers[q.id]={...cur,text:e.target.value}; save();
    });
    document.getElementById("nextBtn").onclick=next;
    document.getElementById("backBtn").onclick=back;
  }
  function renderRanking(app,total){
    const options=["Спокойствие","Чистота и порядок","Личное пространство","Предсказуемость и договорённости","Забота и поддержка"];
    const vals=state.rankingDemo||{};
    const used=new Set(Object.values(vals).filter(v=>v!==""));
    const rows=options.map((o,i)=>{
      const current=vals[i]??"";
      const choices=options.map(x=>{
        const taken=used.has(x)&&x!==current;
        return `<option value="${esc(x)}" ${current===x?"selected":""} ${taken?"disabled":""}>${esc(x)}</option>`;
      }).join("");
      return `<div class="rank-row"><div class="rank-num">${i+1}</div><select class="select rank-select" data-rank="${i}"><option value="">Выбрать…</option>${choices}</select></div>`;
    }).join("");
    app.innerHTML=`<section class="screen">
      ${renderChrome("Демонстрация механики ranking", "", 70)}
      <div class="block-title">UI-прототип — не отдельное задание теста</div>
      <h2 class="question">Расставь варианты по важности.</h2>
      <p class="helper">В полной версии ranking будет подключён только там, где он предусмотрен утверждённым содержанием.</p>
      <div class="rank-list" style="margin-top:18px">${rows}</div>
      ${footer(false)}
    </section>`;
    document.querySelectorAll(".rank-select").forEach(s=>s.addEventListener("change",()=>{
      state.rankingDemo[s.dataset.rank]=s.value; save(); renderRanking(app,total);
    }));
    document.getElementById("nextBtn").onclick=next;
    document.getElementById("backBtn").onclick=back;
  }
  function bindOptions(q,multi){
    document.querySelectorAll("[data-opt]").forEach(btn=>btn.addEventListener("click",()=>{
      const i=Number(btn.dataset.opt);
      if(multi){
        let arr=Array.isArray(state.answers[q.id])?state.answers[q.id]:[];
        if(arr.includes(i)) arr=arr.filter(x=>x!==i);
        else if(arr.length<q.max) arr=[...arr,i];
        state.answers[q.id]=arr;
      } else state.answers[q.id]=i;
      save(); render();
    }));
  }
  function next(){
    if(state.demoIndex < demoScreens.length-1){ state.demoIndex++; save(); render(); }
    else { state.completed=true; save(); render(); }
    window.scrollTo({top:0,behavior:"smooth"});
  }
  function back(){
    if(state.demoIndex>0){state.demoIndex--;save();render();window.scrollTo({top:0,behavior:"smooth"});}
    else {state.started=false;save();render();}
  }
  function renderCompletion(app){
    const payload={
      test:"СЪЕЗЖАЕМСЯ",
      version:"prototype-1.0",
      participant:state.name||"",
      completed:true,
      prototypeScreens:demoScreens.length,
      answers:state.answers,
      rankingDemo:state.rankingDemo
    };
    app.innerHTML=`<section class="screen center-screen completion">
      <div class="completion-icon">✓</div>
      <h2>Прототип завершён</h2>
      <p>Все демонстрационные ответы сохранены локально. В полной версии здесь будет завершение теста из 89 заданий и экспорт ответов.</p>
      <div class="actions">
        <button class="primary" id="exportBtn">Скачать тестовые ответы</button>
        <button class="secondary" id="restartBtn">Пройти прототип заново</button>
      </div>
    </section>`;
    document.getElementById("exportBtn").onclick=()=>downloadJson(payload);
    document.getElementById("restartBtn").onclick=()=>{
      state.current=0;state.demoIndex=0;state.answers={};state.rankingDemo={};state.completed=false;state.started=true;save();render();
    };
  }
  function downloadJson(obj){
    const blob=new Blob([JSON.stringify(obj,null,2)],{type:"application/json"});
    const a=document.createElement("a");a.href=URL.createObjectURL(blob);
    a.download=`Съезжаемся — ${state.name||"прототип"} — ответы.json`;
    a.click();setTimeout(()=>URL.revokeObjectURL(a.href),1000);
  }
  render();
})();

</script>
</body>
</html>
