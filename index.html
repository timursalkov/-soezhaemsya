<!doctype html><html lang="ru"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover"><meta name="theme-color" content="#f5f7fb"><title>СЪЕЗЖАЕМСЯ — Тест перед совместной жизнью</title><style>

:root{
  --bg:#f4f7fb;
  --surface:rgba(255,255,255,.90);
  --surface-strong:#fff;
  --text:#1f2937;
  --muted:#7b8494;
  --line:#e4e9f1;
  --accent:#5f83e8;
  --accent-soft:#edf3ff;
  --accent-strong:#416bd9;
  --danger:#c95656;
  --shadow:0 20px 60px rgba(51,70,105,.10);
  --radius:22px;
}
*{box-sizing:border-box}
html{background:var(--bg);min-height:100%;-webkit-text-size-adjust:100%}
body{margin:0;min-height:100%;font-family:-apple-system,BlinkMacSystemFont,"SF Pro Display","SF Pro Text","Segoe UI",sans-serif;color:var(--text);background:
radial-gradient(circle at 12% 6%,rgba(143,174,245,.18),transparent 32%),
radial-gradient(circle at 92% 18%,rgba(192,174,245,.16),transparent 30%),
var(--bg);}
button,input,textarea,select{font:inherit}
button{touch-action:manipulation}
.app-shell{min-height:100svh;padding:max(18px,env(safe-area-inset-top)) 16px max(22px,env(safe-area-inset-bottom))}
.app{width:min(100%,460px);margin:0 auto;min-height:calc(100svh - 40px);display:flex;flex-direction:column}
.screen{display:flex;flex-direction:column;min-height:calc(100svh - 40px)}
.center-screen{justify-content:center}
.topbar{display:flex;align-items:center;justify-content:space-between;height:44px;margin-bottom:10px}
.icon-btn{width:44px;height:44px;border:0;background:transparent;border-radius:14px;color:var(--text);font-size:25px;display:grid;place-items:center;padding:0}
.progress-label{font-size:13px;font-weight:650;color:var(--muted);letter-spacing:.01em}
.progress{height:5px;background:#e7ecf4;border-radius:999px;overflow:hidden;margin:0 2px 28px}
.progress > span{display:block;height:100%;width:0;background:var(--accent);border-radius:inherit;transition:width .25s ease}
.brand-mark{width:74px;height:74px;border-radius:24px;background:linear-gradient(145deg,#dfe9ff,#eef1ff);display:grid;place-items:center;margin-bottom:22px;box-shadow:0 16px 40px rgba(75,105,180,.12)}
.brand-mark::before{content:"";width:35px;height:35px;border-radius:12px;background:var(--accent);transform:rotate(-10deg);opacity:.9}
.kicker{font-size:13px;font-weight:700;letter-spacing:.08em;text-transform:uppercase;color:var(--accent-strong);margin-bottom:9px}
h1{font-size:36px;line-height:1.03;letter-spacing:-.045em;margin:0 0 10px;font-weight:750}
.subtitle{font-size:18px;line-height:1.35;color:#697386;margin:0 0 28px}
.meta{display:flex;gap:8px;flex-wrap:wrap;margin:0 0 30px}
.pill{padding:8px 12px;border-radius:999px;background:rgba(255,255,255,.72);border:1px solid rgba(226,232,240,.9);font-size:13px;color:#657085}
.primary,.secondary{position:relative;z-index:2;pointer-events:auto;-webkit-tap-highlight-color:transparent}
.primary{width:100%;min-height:56px;border:0;border-radius:17px;background:var(--accent);color:#fff;font-weight:700;font-size:17px;box-shadow:0 12px 28px rgba(95,131,232,.25);transition:transform .12s ease,background .15s ease}
.primary:active{transform:scale(.985)}
.primary:disabled{opacity:.42;box-shadow:none}
.secondary{width:100%;min-height:52px;border:1px solid var(--line);border-radius:16px;background:rgba(255,255,255,.72);color:var(--text);font-weight:650;font-size:16px}
.start-card{background:rgba(255,255,255,.62);border:1px solid rgba(255,255,255,.75);border-radius:30px;padding:28px 24px;box-shadow:var(--shadow);backdrop-filter:blur(18px);-webkit-backdrop-filter:blur(18px)}
.resume-card{margin-top:14px;padding:15px;border-radius:18px;background:rgba(255,255,255,.70);border:1px solid var(--line);font-size:13px;color:var(--muted)}
.question-head{margin-bottom:22px}
.block-label{font-size:12px;font-weight:750;letter-spacing:.07em;text-transform:uppercase;color:var(--accent-strong);margin-bottom:8px}
.block-title{font-size:14px;color:var(--muted);margin-bottom:16px}
.question{font-size:22px;line-height:1.22;letter-spacing:-.025em;font-weight:720;margin:0}
.helper{font-size:13px;color:var(--muted);margin:8px 0 0}
.option-list{display:flex;flex-direction:column;gap:10px;margin:0 0 22px}
.option{position:relative;width:100%;min-height:52px;text-align:left;padding:14px 16px 14px 48px;border:1px solid var(--line);border-radius:17px;background:rgba(255,255,255,.82);color:var(--text);font-size:16px;line-height:1.28;display:flex;align-items:center;box-shadow:0 4px 16px rgba(60,75,105,.03);transition:border-color .15s,background .15s,box-shadow .15s,transform .12s}
.option:active{transform:scale(.992)}
.option::before{content:"";position:absolute;left:16px;top:50%;transform:translateY(-50%);width:20px;height:20px;border:1.7px solid #aeb7c6;border-radius:50%;background:#fff}
.option.selected{border-color:var(--accent);background:var(--accent-soft);box-shadow:0 7px 18px rgba(95,131,232,.09)}
.option.selected::before{border-color:var(--accent);background:var(--accent);box-shadow:inset 0 0 0 5px var(--accent-soft)}
.option.multi::before{border-radius:6px}
.option.multi.selected::before{border-color:var(--accent);background:var(--accent);box-shadow:none}
.option.multi.selected::after{content:"✓";position:absolute;left:20px;top:50%;transform:translateY(-52%);color:#fff;font-size:13px;font-weight:800}
.counter{font-size:13px;color:var(--muted);margin:-12px 0 18px}
.bottom{margin-top:auto;padding-top:12px;padding-bottom:4px}
.textarea{width:100%;min-height:116px;resize:none;border:1px solid var(--line);border-radius:18px;background:rgba(255,255,255,.86);padding:16px;font-size:16px;line-height:1.45;color:var(--text);outline:none;box-shadow:0 4px 16px rgba(60,75,105,.03)}
.textarea:focus{border-color:var(--accent);box-shadow:0 0 0 4px rgba(95,131,232,.10)}
.scale-wrap{background:rgba(255,255,255,.72);border:1px solid var(--line);border-radius:22px;padding:22px 18px;margin-bottom:22px}
.scale-value{text-align:center;font-size:44px;line-height:1;font-weight:760;letter-spacing:-.04em;margin-bottom:18px}
.range{width:100%;height:32px;accent-color:var(--accent)}
.scale-labels{display:flex;justify-content:space-between;gap:15px;font-size:12px;color:var(--muted);line-height:1.25}
.scale-labels span:last-child{text-align:right}
.scenario{background:rgba(255,255,255,.78);border:1px solid var(--line);border-radius:25px;padding:20px 16px;box-shadow:var(--shadow)}
.scenario-tag{font-size:12px;font-weight:800;letter-spacing:.07em;color:var(--accent-strong);text-transform:uppercase;margin-bottom:10px}
.scenario-title{font-size:22px;line-height:1.2;font-weight:720;letter-spacing:-.025em;margin:0 0 18px}
.subquestion{font-size:15px;font-weight:700;margin:22px 0 10px}
.rank-list{display:flex;flex-direction:column;gap:10px;margin-bottom:22px}
.rank-row{display:grid;grid-template-columns:30px 1fr;align-items:center;gap:8px}
.rank-num{font-size:14px;font-weight:750;color:var(--muted);text-align:center}
.select{width:100%;min-height:52px;border:1px solid var(--line);border-radius:16px;background:#fff;padding:0 12px;font-size:16px;color:var(--text)}
.saved{font-size:12px;color:#6f7b8d;text-align:center;min-height:17px;margin-bottom:6px}
.completion-icon{width:68px;height:68px;border-radius:22px;background:var(--accent-soft);display:grid;place-items:center;color:var(--accent);font-size:31px;font-weight:800;margin-bottom:22px}
.completion h2{font-size:30px;line-height:1.05;letter-spacing:-.035em;margin:0 0 10px}
.completion p{font-size:16px;line-height:1.45;color:var(--muted);margin:0 0 28px}
.actions{display:flex;flex-direction:column;gap:10px}
.toast{position:fixed;left:50%;bottom:max(18px,env(safe-area-inset-bottom));transform:translate(-50%,20px);background:#202938;color:#fff;padding:10px 14px;border-radius:999px;font-size:13px;opacity:0;pointer-events:none;transition:opacity .2s,transform .2s;z-index:10}
.toast.show{opacity:1;transform:translate(-50%,0)}
@media(min-width:700px){
  .app-shell{padding-top:32px}
  .app{min-height:calc(100vh - 64px)}
  .screen{min-height:calc(100vh - 64px)}
}


/* Question navigator */
.nav-progress-btn{border:0;background:transparent;color:var(--muted);font:inherit;font-weight:700;font-size:16px;padding:8px 2px;cursor:pointer}
.nav-progress-btn:active{opacity:.65}
.question-nav{position:fixed;inset:0;z-index:1000;background:rgba(235,239,249,.72);backdrop-filter:blur(18px);-webkit-backdrop-filter:blur(18px);display:flex;align-items:flex-end;justify-content:center}
.question-nav-panel{width:100%;max-width:760px;max-height:88vh;background:rgba(255,255,255,.96);border-radius:28px 28px 0 0;box-shadow:0 -12px 50px rgba(31,43,69,.16);padding:18px 18px calc(24px + env(safe-area-inset-bottom));display:flex;flex-direction:column}
.question-nav-head{display:flex;align-items:center;justify-content:space-between;padding:2px 2px 14px}
.question-nav-title{font-size:21px;font-weight:800;color:var(--text)}
.question-nav-close{width:42px;height:42px;border:0;border-radius:50%;background:#eef1f7;color:var(--text);font-size:25px;line-height:1;cursor:pointer}
.question-nav-hint{font-size:14px;color:var(--muted);margin:0 2px 16px}
.question-nav-list{overflow:auto;-webkit-overflow-scrolling:touch;padding:2px 2px 8px}
.question-nav-block{font-size:12px;letter-spacing:.08em;text-transform:uppercase;font-weight:800;color:var(--accent);margin:12px 2px 8px}
.question-nav-grid{display:grid;grid-template-columns:repeat(6,minmax(0,1fr));gap:8px}
.question-nav-item{min-height:48px;border:1px solid #dfe4ee;background:#fff;border-radius:14px;color:var(--text);font-size:15px;font-weight:700;cursor:pointer}
.question-nav-item.answered{background:#f1f5ff;border-color:#c9d6f7}
.question-nav-item.current{background:var(--accent);border-color:var(--accent);color:#fff}
.question-nav-item.current.answered{color:#fff}
@media (min-width:520px){.question-nav{align-items:center}.question-nav-panel{border-radius:28px;max-height:82vh;width:min(680px,calc(100% - 32px));}}

</style></head><body><div class="app-shell"><main id="app" class="app"></main></div><script>
const QUESTIONS=[{"id":1,"block":1,"blockTitle":"Представление о совместной жизни","text":"Идеальный обычный вечер дома:","type":"single","options":["В основном проводим его вместе","Вместе, но каждый занимается своим","Иногда вместе, иногда отдельно","В основном каждый занимается своими делами","Зависит от дня и обстоятельств","Другое"]},{"id":2,"block":1,"blockTitle":"Представление о совместной жизни","text":"Насколько важно, чтобы дом ощущался как общее пространство пары?","type":"scale","minLabel":"Совсем не важно","maxLabel":"Очень важно"},{"id":3,"block":1,"blockTitle":"Представление о совместной жизни","text":"Что больше всего важно для комфортной совместной жизни? Выбери до 3 вариантов:","type":"multi","max":3,"options":["Спокойствие","Чистота и порядок","Много времени вместе","Личное пространство","Предсказуемость и договорённости","Свобода делать по-своему","Забота и поддержка","Спонтанность","Другое"]},{"id":4,"block":1,"blockTitle":"Представление о совместной жизни","text":"Если после съезда обнаружится, что ваши бытовые привычки различаются, какой подход тебе ближе?","type":"single","options":["Подстроиться друг под друга","Установить конкретные правила","Каждый делает по-своему, если это не мешает другому","Договариваться отдельно по каждому вопросу","Попробовать несколько вариантов и обсудить, что работает","Зависит от ситуации","Другое"]},{"id":5,"block":1,"blockTitle":"Представление о совместной жизни","text":"Назови до 3 вещей, без которых дом перестаёт ощущаться для тебя комфортным.","type":"text","lines":4},{"id":6,"block":1,"blockTitle":"Представление о совместной жизни","text":"Насколько важно, чтобы партнёр учитывал и подстраивался под твои бытовые привычки?","type":"scale","minLabel":"Совсем не важно","maxLabel":"Очень важно"},{"id":7,"block":2,"blockTitle":"Чистота и порядок","text":"Насколько тебя устраивает обычный рабочий беспорядок дома?","type":"scale","minLabel":"Совсем не устраивает","maxLabel":"Полностью устраивает"},{"id":8,"block":2,"blockTitle":"Чистота и порядок","text":"Какие зоны для тебя наиболее важно поддерживать в порядке? Выбери до 4:","type":"multi","max":4,"options":["Поверхности кухни","Посуда","Пол","Ванная/туалет","Одежда и личные вещи","Рабочее место","Кровать","Холодильник и продукты","Общий визуальный порядок","Другое"]},{"id":9,"block":2,"blockTitle":"Чистота и порядок","text":"Насколько важно, чтобы общие зоны были приведены в порядок перед сном?","type":"scale","minLabel":"Совсем не важно","maxLabel":"Очень важно"},{"id":10,"block":2,"blockTitle":"Чистота и порядок","text":"Какой беспорядок тебе труднее всего терпеть несколько дней? Выбери до 3:","type":"multi","max":3,"options":["Грязная посуда","Вещи не на своих местах","Грязный пол","Ванная/туалет","Полный мусор","Грязные поверхности кухни","Одежда/полотенца","Общий визуальный беспорядок","Другое"]},{"id":11,"block":2,"blockTitle":"Чистота и порядок","text":"Насколько ты готов(а) жить с уровнем порядка, который заметно отличается от твоего собственного?","type":"scale","minLabel":"Совсем не готов(а)","maxLabel":"Полностью готов(а)"},{"id":12,"block":2,"blockTitle":"Чистота и порядок","text":"Если партнёр считает, что дома уже достаточно чисто, а тебе кажется, что пора убираться:","type":"single","options":["Убираться до своего стандарта","Убирать только то, что мешает вам обоим","Договориться о минимальном общем стандарте","Чередоваться","Оставить как есть","Обсудить конкретную проблему и решить её","Другое"]},{"id":13,"block":2,"blockTitle":"Чистота и порядок","text":"Как тебе кажется, что партнёру будет труднее всего терпеть в бытовом беспорядке?","type":"text","lines":4},{"id":14,"block":3,"blockTitle":"Бытовые обязанности","text":"Какую модель бытовых обязанностей ты предпочитаешь?","type":"single","options":["Фиксированные обязанности","Чередование","Кто заметил — тот сделал","С учётом времени и энергии","Закреплённые категории + взаимопомощь","По ситуации","Другое"]},{"id":15,"block":3,"blockTitle":"Бытовые обязанности","text":"Насколько важно, чтобы партнёр сам замечал очевидную незапланированную бытовую задачу — и что ты обычно ожидаешь в такой ситуации?","type":"single","options":["Очень важно; я ожидаю, что он/она сделает её сам(а)","Важно; если заметил(а), можно сделать без отдельного назначения","Лучше спросить, кто может это сделать","Лучше заранее распределять такие задачи","Можно подождать, пока задача будет распределена","Зависит от задачи","Другое"]},{"id":16,"block":3,"blockTitle":"Бытовые обязанности","text":"Какая модель справедливого распределения тебе ближе?","type":"single","options":["50/50","По времени и энергии","По закреплённым категориям","Кто что сделал — то и считается","Один больше делает в одной области, другой — в другой","Другое"]},{"id":17,"block":3,"blockTitle":"Бытовые обязанности","text":"Что для тебя тяжелее в быту?","type":"single","options":["Само выполнение дел","Помнить, планировать и следить за выполнением","И то и другое примерно одинаково","Зависит от дела","Другое"]},{"id":18,"block":3,"blockTitle":"Бытовые обязанности","text":"Насколько тебя раздражает, когда приходится регулярно напоминать партнёру о бытовых задачах?","type":"scale","minLabel":"Совсем не раздражает","maxLabel":"Очень раздражает"},{"id":19,"block":3,"blockTitle":"Бытовые обязанности","text":"Насколько ты готов(а) временно брать на себя больше бытовой нагрузки, если у партнёра больше работы, усталости или других нагрузок?","type":"scale","minLabel":"Совсем не готов(а)","maxLabel":"Полностью готов(а)"},{"id":20,"block":3,"blockTitle":"Бытовые обязанности","text":"Как тебе кажется, какую модель распределения быта партнёр, скорее всего, считает справедливой?","type":"text","lines":4},{"id":21,"block":4,"blockTitle":"Еда и кухня","text":"Какой формат домашней еды тебе ближе?","type":"single","options":["Готовить вместе","Готовит тот, у кого есть время или желание","Каждый готовит себе сам","Заранее распределять готовку","Чаще заказывать/есть вне дома","Смешанный вариант", function isValidAnswer(q,v){

 if(q.type==='single'){
   const choice=v&&typeof v==='object'&&!Array.isArray(v)?v.choice:v;
   return Number.isInteger(choice) && choice>=0 && choice<q.options.length;
 }
 if(q.type==='multi'){
   return Array.isArray(v) && v.length>0 && v.every(i=>Number.isInteger(i)&&i>=0&&i<q.options.length);
 }
 if(q.type==='scale'){
   return Number.isFinite(Number(v)) && Number(v)>=0 && Number(v)<=10;
 }
 if(q.type==='text'){
   return typeof v==='string' && !!v.trim();
 }
 if(q.type==='scenario'){
   return !!v && typeof v==='object'&&!Array.isArray(v) &&
     Number.isInteger(v.choice) && v.choice>=0 && v.choice<q.options.length;
 }

}

}

function delegatedAction(e){
